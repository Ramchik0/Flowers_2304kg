<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Кабинет мастера — flowers_kg2304</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { min-height: 100vh; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
    .top a { font-size: 14px; color: var(--muted); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(20px, 4vw, 32px); margin-bottom: 24px; }
    .panel h2 { font: 600 22px/1.2 var(--f-display); margin: 0 0 20px; }
    .form { display: grid; gap: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .drop {
      display: grid; place-items: center; text-align: center; gap: 8px;
      min-height: 220px; border: 2px dashed var(--line); border-radius: var(--r-md);
      cursor: pointer; padding: 16px; color: var(--muted); position: relative; overflow: hidden;
      background: var(--bg);
    }
    .drop:hover { border-color: var(--poppy); }
    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .drop b { font: 600 16px/1.3 var(--f-display); color: var(--ink); }
    .list { display: grid; gap: 10px; }
    .item { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); }
    .item__img { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
    .item__img img, .item__img svg { width: 100%; height: 100%; object-fit: cover; }
    .item__title { font-weight: 600; }
    .item__meta { font: 400 12px/1.4 var(--f-mono); color: var(--muted); }
    .item__actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .mini { font: 500 13px/1 var(--f-body); padding: 9px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
    .mini:hover { border-color: var(--ink); }
    .mini--on { background: var(--poppy); border-color: var(--poppy); color: #fff; }
    .mini--danger:hover { border-color: var(--poppy); color: var(--poppy); }
    .msg { padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 15px; }
    .msg--error { background: #fde2df; color: #8a1d14; }
    .toast { position: fixed; left: 50%; bottom: 24px; translate: -50% 0; background: var(--ink); color: var(--bg); padding: 14px 20px; border-radius: 999px; font-weight: 600; opacity: 0; transition: opacity .3s, translate .3s; pointer-events: none; z-index: 90; }
    .toast.show { opacity: 1; translate: -50% -8px; }
    .btn[disabled] { opacity: .6; pointer-events: none; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; }
      .item { grid-template-columns: 56px 1fr; }
      .item__actions { grid-column: 1 / -1; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="index.html" class="logo"><span class="logo__text">flowers<em>_kg2304</em></span></a>
      <div>
        <a href="index.html">На сайт</a>
        <button class="mini" id="logout" hidden>Выйти</button>
      </div>
    </div>

    <div class="msg" id="notConfigured" hidden>
      Загрузка фото ещё не подключена. Разработчику: заполните <code>supabaseUrl</code> и <code>supabaseAnonKey</code> в <code>js/config.js</code> — инструкция в README.md.
    </div>

    <!-- Вход -->
    <section class="panel" id="loginPanel" hidden>
      <h2>Вход для мастера</h2>
      <form class="form" id="loginForm">
        <label class="field"><span>Эл. почта</span><input type="email" id="email" autocomplete="username" required></label>
        <label class="field"><span>Пароль</span><input type="password" id="password" autocomplete="current-password" required></label>
        <div class="msg msg--error" id="loginError" hidden></div>
        <button class="btn btn--primary btn--wide" type="submit">Войти</button>
      </form>
    </section>

    <!-- Добавление -->
    <section class="panel" id="addPanel" hidden>
      <h2>Добавить работу</h2>
      <form class="form" id="addForm">
        <label class="drop" id="drop">
          <input type="file" id="photo" accept="image/*" required>
          <span><b>Выберите фото</b><br>или сфотографируйте цветок</span>
        </label>
        <label class="field"><span>Название</span><input type="text" id="title" placeholder="Например: Пион-светильник, белый" required maxlength="80"></label>
        <div class="row">
          <label class="field"><span>Раздел</span><select id="category"></select></label>
          <label class="field"><span>Цвет <i>(для фона карточки)</i></span><input type="color" id="color" value="#E2392B" style="height:52px;padding:6px"></label>
        </div>
        <label class="field"><span>Описание <i>(необязательно)</i></span><textarea id="description" rows="2" maxlength="200" placeholder="Например: 1,5 метра, с подсветкой"></textarea></label>
        <label class="check"><input type="checkbox" id="isNew" checked> <span>Показать в «Новое»</span></label>
        <div class="msg msg--error" id="addError" hidden></div>
        <button class="btn btn--primary btn--wide" type="submit" id="publishBtn">Опубликовать</button>
      </form>
    </section>

    <!-- Список -->
    <section class="panel" id="listPanel" hidden>
      <h2>Работы на сайте <span class="tag" id="countTag"></span></h2>
      <div class="list" id="list"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/flower.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
